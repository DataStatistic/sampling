

name: Publicar curso de Muestreo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Preparar archivos del sitio
        run: |
          mkdir -p _site
          cp -a docs/. _site/
          mkdir -p _site/code/R
          cp -a code/R/. _site/code/R/

      - name: Generar índices de ejemplos
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html import escape
          from urllib.parse import quote

          origen = Path("code/R")
          destino = Path("_site/code/R")
          base_web = "https://datastatistic.github.io/sampling"
          base_git = "https://github.com/DataStatistic/sampling/blob/main"

          temas = [
              ("01-conceptos", "Conceptos de inferencia y estimación"),
              ("02-elementos", "Diseños de muestreo de elementos"),
              ("03-estratificado", "Muestreo estratificado"),
              ("04-etapas", "Muestreo en varias etapas"),
              ("05-tamano-muestra", "Tamaño de muestra"),
              ("06-no-respuesta", "No respuesta"),
          ]

          for carpeta, titulo in temas:
              archivos = sorted(
                  (origen / carpeta).iterdir(),
                  key=lambda x: x.name.lower()
              ) if (origen / carpeta).exists() else []

              enlaces = []

              for archivo in archivos:
                  if not archivo.is_file() or archivo.name.startswith("."):
                      continue

                  ruta = quote(f"code/R/{carpeta}/{archivo.name}")

                  if archivo.suffix.lower() == ".html":
                      url = f"{base_web}/{ruta}"
                  else:
                      url = f"{base_git}/{ruta}"

                  enlaces.append(
                      f'<li><a href="{escape(url, quote=True)}">'
                      f'{escape(archivo.name)}</a></li>'
                  )

              contenido = (
                  "<ul>" + "\n".join(enlaces) + "</ul>"
                  if enlaces else "<p>Aún no hay ejemplos publicados.</p>"
              )

              pagina = f"""<!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>{escape(titulo)}</title>
            <style>
              body {{
                font-family: Arial, sans-serif;
                max-width: 850px;
                margin: 50px auto;
                padding: 0 24px;
                color: #1f2937;
                line-height: 1.7;
              }}
              h1 {{ color: #1d4ed8; }}
              a {{ color: #1d4ed8; }}
              li {{ margin-bottom: 12px; }}
            </style>
          </head>
          <body>
            <h1>{escape(titulo)}</h1>
            <h2>Ejemplos en R</h2>
            {contenido}
            <p><a href="{base_web}/">Volver al curso</a></p>
          </body>
          </html>"""

              salida = destino / carpeta
              salida.mkdir(parents=True, exist_ok=True)
              (salida / "index.html").write_text(
                  pagina, encoding="utf-8"
              )
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
